name: Sideload IPA

# Builds unsigned .ipa files for sideloading (SideStore / AltStore / Sideloadly /
# TrollStore / Feather / ESign). The sideloading tool signs the app on install,
# so no certificates or secrets are needed here.
#
# Two variants are produced from one build:
#   *-sideload.ipa  without app extensions: 1 App ID, for free Apple ID accounts
#   *-full.ipa      with Safari & Notification Service extensions:
#                   for TrollStore or paid certificates

on:
  push:
    branches: [ develop, 'claude/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: sideload-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    # Builds take ~30 min: run only on tags, manual runs, or commits marked [build] / [release]
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_(26\.[3-9]|27)' | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No compatible Xcode (26.3+ / 27) found. Available:"; ls -d /Applications/Xcode_*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install Tuist
        uses: jdx/mise-action@v2
        with:
          install_args: tuist

      - name: Cache Tuist dependencies
        uses: actions/cache@v4
        with:
          path: Tuist/.build
          key: tuist-deps-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: tuist-deps-

      - name: Generate project
        run: |
          tuist install
          tuist generate --no-open

      - name: Build
        run: |
          set +e
          xcodebuild build \
            -workspace ForPDA.xcworkspace \
            -scheme ForPDA \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            > xcodebuild.log 2>&1
          STATUS=$?
          grep -E '(error:|BUILD SUCCEEDED|BUILD FAILED)' xcodebuild.log | sort -u | head -100
          if [ $STATUS -ne 0 ]; then echo "xcodebuild failed with $STATUS"; exit $STATUS; fi
          test -f build/Build/Products/Release-iphoneos/ForPDA.app/Info.plist

      - name: Package IPAs
        run: |
          APP=build/Build/Products/Release-iphoneos/ForPDA.app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")
          BASE="ForPDA-Mod-${VERSION}-${BUILD}"
          echo "Display name: $(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Info.plist" 2>/dev/null || echo '(not set)')"
          echo "Icon: $(/usr/libexec/PlistBuddy -c 'Print CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist" 2>/dev/null || echo '(not set)')"
          echo "Extensions in build:"; ls "$APP/PlugIns" 2>/dev/null || echo "  (none)"

          # Full: with extensions
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "${BASE}-full.ipa" Payload

          # Sideload: without extensions
          rm -rf Payload/ForPDA.app/PlugIns
          zip -qry "${BASE}-sideload.ipa" Payload
          rm -rf Payload

          echo "IPA_SIDELOAD=${BASE}-sideload.ipa" >> "$GITHUB_ENV"
          echo "IPA_FULL=${BASE}-full.ipa" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -lh *.ipa

      - name: Upload sideload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_SIDELOAD }}
          path: ${{ env.IPA_SIDELOAD }}

      - name: Upload full IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_FULL }}
          path: ${{ env.IPA_FULL }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      # Release on a pushed tag v*, or on a push whose commit message contains [release]
      - name: Compute release tag
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VERSION}-mod.${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: ForPDA Mod ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ env.IPA_SIDELOAD }}
            ${{ env.IPA_FULL }}
