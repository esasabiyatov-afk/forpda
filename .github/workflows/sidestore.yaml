name: SideStore IPA

# Builds an unsigned .ipa for sideloading (SideStore / AltStore / Sideloadly).
# The sideloading tool signs the app with your own Apple ID on install,
# so no certificates or secrets are needed here.

on:
  push:
    branches: [ develop, 'claude/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      include_extensions:
        description: 'Include Safari & Notification extensions (each uses an extra App ID on a free account)'
        type: boolean
        default: false

concurrency:
  group: sidestore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_(26\.[3-9]|27)' | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No compatible Xcode (26.3+ / 27) found. Available:"; ls -d /Applications/Xcode_*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install Tuist
        uses: jdx/mise-action@v2
        with:
          install_args: tuist

      - name: Cache Tuist dependencies
        uses: actions/cache@v4
        with:
          path: Tuist/.build
          key: tuist-deps-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: tuist-deps-

      - name: Generate project
        run: |
          tuist install
          tuist generate --no-open

      - name: Build
        run: |
          set +e
          xcodebuild build \
            -workspace ForPDA.xcworkspace \
            -scheme ForPDA \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            > xcodebuild.log 2>&1
          STATUS=$?
          grep -E '(error:|BUILD SUCCEEDED|BUILD FAILED)' xcodebuild.log | sort -u | head -100
          if [ $STATUS -ne 0 ]; then echo "xcodebuild failed with $STATUS"; exit $STATUS; fi
          test -f build/Build/Products/Release-iphoneos/ForPDA.app/Info.plist

      - name: Package IPA
        env:
          INCLUDE_EXTENSIONS: ${{ inputs.include_extensions || 'false' }}
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ForPDA.app Payload/
          if [ "$INCLUDE_EXTENSIONS" != "true" ]; then
            rm -rf Payload/ForPDA.app/PlugIns
          fi
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/ForPDA.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Payload/ForPDA.app/Info.plist)
          NAME="ForPDA-${VERSION}-${BUILD}-sidestore.ipa"
          zip -qry "$NAME" Payload
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"
          ls -lh "$NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      # Release on a pushed tag v*, or on a push whose commit message contains [release]
      - name: Compute release tag
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/ForPDA.app/Info.plist)
            TAG="v${VERSION}-mod.${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: ForPDA Mod ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.IPA_NAME }}
